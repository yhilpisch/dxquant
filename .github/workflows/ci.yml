name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "notebooks/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "notebooks/**"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      - name: Ruff
        run: ruff check --config pyproject.toml src tests docs/conf.py tools notebooks

      - name: Mypy
        run: mypy src tests docs/conf.py tools

      - name: Python conventions
        run: python tools/check_conventions.py

      - name: Pytest + coverage
        run: pytest --cov=src/dxquant --cov-report=term-missing

  # Build the Sphinx API reference so doc/config drift is caught early.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs
        run: sphinx-build -W --keep-going -b html docs docs/_build

  # Execute the tutorial notebooks end-to-end so they cannot silently rot.
  notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install notebook runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbconvert ipykernel

      - name: Formal notebook validation
        run: python tools/validate_colab.py

      - name: Execute notebooks with their setup cells
        run: |
          for nb in notebooks/*.ipynb; do
            python -m pip uninstall -y dxquant
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
          done

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test installed wheel outside source tree
        run: |
          python -m pip install pytest pytest-cov dist/*.whl
          cp -R tests "$RUNNER_TEMP/dxquant-tests"
          cd "$RUNNER_TEMP"
          python -m pytest dxquant-tests
